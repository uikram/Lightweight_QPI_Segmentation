experiment_name: fullft_mobilenet_unet
data_root: ./dataset
cache_dir: ./cache
dataset:
  batch_size: 16
  num_workers: 4
  image_size: 256
model:
  architecture: mobilenet_unet
  in_channels: 1
  num_classes: 5
training:
  epochs: 50
  learning_rate: 0.001
  optimizer: AdamW
  mixed_precision: fp16
loss_type: physics_aware
lambda1_pmc: 0.1
lambda2_bga: 0.05
lambda3_pv: 0.1
class_weights:
- 0.5
- 1.0
- 1.5
- 2.0
- 2.0
results_dir: results/full_finetune/mobilenet_unet
checkpoint_dir: results/full_finetune/mobilenet_unet/checkpoints
